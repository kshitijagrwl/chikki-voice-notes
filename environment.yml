name: chikki
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - numpy>=1.26
  - pip
  - pip:
    # Audio
    - sounddevice>=0.5.0
    - soundfile>=0.13.0
    # Transcription
    - mlx-whisper>=0.4.0
    - parakeet-mlx>=0.2.0
    # Diarization (PR4: #1) — pyannote runs on MPS on Apple Silicon.
    # Requires HF_TOKEN in .env and EULA acceptance for
    # pyannote/speaker-diarization-3.1.
    - torch>=2.2
    - pyannote.audio>=3.1
    # LLM providers
    - google-genai>=1.0.0
    - openai>=1.0.0
    - anthropic>=0.40.0
    # macOS menu bar
    - rumps>=0.4.0
    # Config + CLI
    - pyyaml>=6.0
    - click>=8.1.0
